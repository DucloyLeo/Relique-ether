<script>
'use strict';
/* =====================================================================
   RELIQUES D'ÉTHER — action-RPG de farming de loot en pixel art
   Fichier unique : moteur, rendu, sprites, entités, loot, interface, sauvegarde
   ===================================================================== */

/* =====================================================================
   SECTION 1 — MOTEUR (canvas, utilitaires, entrées, audio)
   ===================================================================== */
const W = 480, H = 270, TS = 16;
const screenCv = document.getElementById('game');
const sctx = screenCv.getContext('2d');
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const buf = mkCanvas(W, H);
const g = buf.getContext('2d');
g.imageSmoothingEnabled = false;
let SCALE = 1;
function resize() {
  SCALE = Math.max(1, Math.floor(Math.min(window.innerWidth / W, window.innerHeight / H)));
  screenCv.width = W * SCALE; screenCv.height = H * SCALE;
  screenCv.style.width = (W * SCALE) + 'px'; screenCv.style.height = (H * SCALE) + 'px';
  sctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize); resize();

/* ---------- utilitaires ---------- */
const TAU = Math.PI * 2;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function angDiff(a, b) { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function wpick(arr, wf) { let t = 0; for (const a of arr) t += wf(a); let r = Math.random() * t; for (const a of arr) { r -= wf(a); if (r <= 0) return a; } return arr[arr.length - 1]; }
function hash2(x, y, s = 0) { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function mkRng(seed) { let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const fmt = n => { n = Math.round(n); return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : '' + n; };

/* ---------- entrées ---------- */
const keys = {}, kp = {};
const mouse = { x: W / 2, y: H / 2, l: false, r: false, lc: false, rc: false, wheel: 0 };
const PREVENT = { Space: 1, Tab: 1, ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1 };
window.addEventListener('keydown', e => {
  if (ui.rebind) {   /* réattribution d'une touche depuis les options */
    if (e.code !== 'Escape') { CFG.keys[ui.rebind] = e.code; CFG.lbl[ui.rebind] = keyLabel(e); saveCfg(); }
    ui.rebind = null; e.preventDefault(); return;
  }
  if (!keys[e.code]) kp[e.code] = true;
  keys[e.code] = true;
  if (e.key && e.key.toLowerCase() === 'm' && !e.repeat) kp.Mute = true;
  if (PREVENT[e.code]) e.preventDefault();
  Snd.init();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.l = mouse.r = false; if (GS === 'run' && !UIS && !P.dead) UIS = 'pause'; /* pause automatique si la fenêtre perd le focus */ });
function mousePos(e) {
  const r = screenCv.getBoundingClientRect();
  mouse.x = clamp((e.clientX - r.left) / (r.width || 1) * W, 0, W - 1);
  mouse.y = clamp((e.clientY - r.top) / (r.height || 1) * H, 0, H - 1);
}
window.addEventListener('mousemove', mousePos);
window.addEventListener('mousedown', e => {
  mousePos(e); Snd.init();
  if (e.button === 0) { mouse.l = true; mouse.lc = true; }
  if (e.button === 2) { mouse.r = true; mouse.rc = true; }
  e.preventDefault();
});
window.addEventListener('mouseup', e => { if (e.button === 0) mouse.l = false; if (e.button === 2) mouse.r = false; });
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('wheel', e => { mouse.wheel += Math.sign(e.deltaY); }, { passive: true });
function endInput() { for (const k in kp) delete kp[k]; mouse.lc = mouse.rc = false; mouse.wheel = 0; }
const inRect = (x, y, w, h) => mouse.x >= x && mouse.x < x + w && mouse.y >= y && mouse.y < y + h;

/* ---------- audio (Web Audio API, sons synthétisés) ---------- */
const Snd = {
  ac: null, master: null, musBus: null, muted: false, last: {}, nbuf: null, off: 0,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this.ac = new AC(); this.build(); } catch (err) { this.ac = null; }
  },
  /* chaîne audio : effets + musique -> gain maître -> compresseur (évite la saturation) -> sortie */
  build() {
    const ac = this.ac, comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 6; comp.attack.value = 0.004; comp.release.value = 0.2;
    this.master = ac.createGain(); this.master.connect(comp); comp.connect(ac.destination);
    this.musBus = ac.createGain(); this.musBus.connect(this.master);
    const n = ac.sampleRate, b = ac.createBuffer(1, n, n), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    this.nbuf = b; this.apply();
  },
  apply() { if (!this.master) return; this.master.gain.value = this.muted ? 0 : VOLS[CFG.vol]; this.musBus.gain.value = CFG.music ? 1.3 : 0; },
  setMute(m) { this.muted = m; this.apply(); },
  tone(f, dur, type = 'square', vol = 0.2, f2 = 0, delay = 0) {
    if (!this.ac || this.muted) return;
    const t = this.ac.currentTime + this.off + delay, o = this.ac.createOscillator(), ga = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    ga.gain.setValueAtTime(0.0001, t); ga.gain.linearRampToValueAtTime(vol, t + 0.008);
    ga.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(ga); ga.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.2, freq = 2000, f2 = 0, delay = 0, q = 1, bus) {
    if (!this.ac || this.muted || !this.nbuf) return;
    const t = this.ac.currentTime + this.off + delay, s = this.ac.createBufferSource(), fl = this.ac.createBiquadFilter(), ga = this.ac.createGain();
    s.buffer = this.nbuf; s.loop = true; fl.type = 'bandpass'; fl.Q.value = q; fl.frequency.setValueAtTime(freq, t);
    if (f2) fl.frequency.exponentialRampToValueAtTime(Math.max(40, f2), t + dur);
    ga.gain.setValueAtTime(vol, t); ga.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(ga); ga.connect(bus || this.master); s.start(t, Math.random()); s.stop(t + dur + 0.02);
  },
  /* note de musique : attaque douce, filtre passe-bas, envoyée sur le bus musique */
  mus(f, dur, type, vol, delay = 0, atk = 0.03) {
    if (!this.ac || this.muted || !CFG.music) return;
    const t = this.ac.currentTime + this.off + delay, o = this.ac.createOscillator(), ga = this.ac.createGain(), fl = this.ac.createBiquadFilter();
    o.type = type; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.value = Math.min(5000, f * 4);
    ga.gain.setValueAtTime(0.0001, t); ga.gain.linearRampToValueAtTime(vol, t + atk); ga.gain.setValueAtTime(vol, t + Math.max(atk, dur * 0.5));
    ga.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(fl); fl.connect(ga); ga.connect(this.musBus); o.start(t); o.stop(t + dur + 0.05);
  },
  seq(notes, step, type, vol, dur) { notes.forEach((n, i) => this.tone(n, dur || step * 1.8, type, vol, 0, i * step)); }
};
const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
const SFX = {
  swing() { Snd.noise(0.12, 0.16, 900, 3200, 0, 0.8); },
  shoot() { Snd.tone(720, 0.09, 'square', 0.07, 260); Snd.noise(0.05, 0.05, 3000); },
  arrow() { Snd.noise(0.07, 0.1, 2400, 5200, 0, 2); Snd.tone(900, 0.04, 'triangle', 0.05, 500); },
  hit() { Snd.noise(0.07, 0.18, 1100, 300); Snd.tone(170, 0.07, 'square', 0.09, 70); },
  crit() { Snd.noise(0.1, 0.22, 2200, 400); Snd.tone(300, 0.12, 'sawtooth', 0.1, 80); Snd.tone(1300, 0.08, 'square', 0.05, 900); },
  kill() { Snd.tone(320, 0.16, 'square', 0.08, 60); Snd.noise(0.14, 0.12, 700, 150); },
  hurt() { Snd.tone(210, 0.18, 'sawtooth', 0.16, 90); Snd.noise(0.1, 0.14, 500, 200); },
  dash() { Snd.noise(0.16, 0.14, 500, 2600, 0, 0.6); },
  skillW() { Snd.noise(0.5, 0.16, 500, 1800, 0, 0.7); Snd.tone(140, 0.4, 'sawtooth', 0.07, 280); },
  skillM() { Snd.tone(900, 0.3, 'sine', 0.12, 200); Snd.noise(0.3, 0.1, 1800, 300); },
  skillA() { for (let i = 0; i < 4; i++) Snd.noise(0.06, 0.09, 2600, 5200, i * 0.025, 2); },
  boom() { Snd.noise(0.4, 0.3, 500, 60, 0, 0.5); Snd.tone(110, 0.3, 'sine', 0.25, 35); },
  zap() { Snd.tone(1600, 0.12, 'sawtooth', 0.08, 180); Snd.noise(0.1, 0.12, 4200, 900, 0, 3); },
  tele() { Snd.tone(420, 0.2, 'triangle', 0.07, 640); },
  eshoot() { Snd.tone(360, 0.1, 'square', 0.05, 180); },
  spawn() { Snd.tone(160, 0.25, 'triangle', 0.07, 420); },
  roar() { Snd.tone(90, 0.8, 'sawtooth', 0.22, 45); Snd.noise(0.8, 0.2, 300, 90, 0, 0.6); },
  pickup() { Snd.tone(880, 0.06, 'square', 0.07); Snd.tone(1320, 0.09, 'square', 0.07, 0, 0.05); },
  orb() { Snd.tone(660, 0.12, 'sine', 0.1, 990); },
  click() { Snd.tone(620, 0.04, 'square', 0.06); },
  deny() { Snd.tone(160, 0.12, 'square', 0.08, 110); },
  equip() { Snd.noise(0.06, 0.12, 1800, 700); Snd.tone(520, 0.08, 'triangle', 0.1, 780); },
  recycle() { Snd.noise(0.2, 0.14, 2600, 500, 0, 1.5); Snd.tone(240, 0.12, 'square', 0.05, 120); },
  upgrade() { Snd.noise(0.05, 0.2, 3000, 1500); Snd.seq([NOTE(72), NOTE(76), NOTE(79)], 0.06, 'square', 0.08); },
  fuseOk() { Snd.seq([NOTE(67), NOTE(72), NOTE(76), NOTE(79), NOTE(84)], 0.07, 'triangle', 0.12); },
  fuseKo() { Snd.seq([NOTE(64), NOTE(60), NOTE(57)], 0.09, 'triangle', 0.09); },
  levelup() { Snd.seq([NOTE(60), NOTE(64), NOTE(67), NOTE(72), NOTE(76), NOTE(79)], 0.07, 'square', 0.1, 0.22); Snd.tone(NOTE(84), 0.5, 'triangle', 0.1, 0, 0.42); },
  wave() { Snd.seq([NOTE(57), NOTE(64)], 0.12, 'triangle', 0.1, 0.3); },
  victory() { Snd.seq([NOTE(60), NOTE(64), NOTE(67), NOTE(72), NOTE(67), NOTE(72), NOTE(76)], 0.11, 'square', 0.1, 0.3); },
  death() { Snd.seq([NOTE(57), NOTE(53), NOTE(50), NOTE(45)], 0.2, 'sawtooth', 0.09, 0.5); },
  portal() { Snd.tone(200, 0.6, 'sine', 0.14, 800); Snd.noise(0.6, 0.08, 800, 3200, 0, 2); },
  /* son de drop : de plus en plus marquant selon la rareté */
  drop(r) {
    if (r <= 0) { Snd.tone(520, 0.05, 'square', 0.04); return; }
    if (r === 1) { Snd.seq([NOTE(72), NOTE(76)], 0.05, 'square', 0.06); return; }
    if (r === 2) { Snd.seq([NOTE(72), NOTE(76), NOTE(79)], 0.06, 'square', 0.08); return; }
    if (r === 3) { Snd.seq([NOTE(69), NOTE(73), NOTE(76), NOTE(81)], 0.07, 'triangle', 0.13, 0.25); Snd.noise(0.3, 0.05, 5000, 8000, 0, 4); return; }
    if (r === 4) {
      Snd.seq([NOTE(62), NOTE(66), NOTE(69), NOTE(74), NOTE(78), NOTE(81)], 0.08, 'sawtooth', 0.1, 0.35);
      Snd.seq([NOTE(74), NOTE(78), NOTE(81), NOTE(86)], 0.08, 'triangle', 0.1, 0.5);
      Snd.tone(NOTE(38), 0.9, 'sine', 0.22, 0); Snd.noise(0.8, 0.07, 6000, 9000, 0.2, 4); return;
    }
    Snd.tone(NOTE(33), 1.8, 'sine', 0.3); Snd.noise(1.2, 0.2, 200, 4000, 0, 0.5);
    [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => { Snd.tone(NOTE(60 + s), 1.4 - i * 0.1, 'sawtooth', 0.07, 0, 0.25 + i * 0.09); Snd.tone(NOTE(72 + s), 0.5, 'triangle', 0.08, 0, 0.3 + i * 0.09); });
    for (let i = 0; i < 10; i++) Snd.tone(NOTE(84 + [0, 4, 7, 12][i % 4]), 0.12, 'square', 0.04, 0, 1 + i * 0.07);
  }
};
/* musique générative : une grille de 4 accords par lieu, basse + nappe + arpège + mélodie éparse ;
   le tempo s'accélère et une percussion s'ajoute face au boss */
const MUSIC = [
  { step: 0.30, ch: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], w: 'triangle', hat: 0 },   /* camp : la mineur, paisible */
  { step: 0.24, ch: [[48, 52, 55], [55, 59, 62], [57, 60, 64], [53, 57, 60]], w: 'triangle', hat: 0 },   /* Sylve : do majeur, lumineux */
  { step: 0.26, ch: [[50, 53, 57], [48, 52, 55], [46, 50, 53], [45, 49, 52]], w: 'triangle', hat: 0 },   /* Olympe : cadence andalouse */
  { step: 0.18, ch: [[45, 48, 52], [45, 48, 52], [41, 45, 48], [43, 47, 50]], w: 'square', hat: 1 },     /* Néon : pulsation synthétique */
  { step: 0.28, ch: [[48, 51, 55], [44, 48, 51], [41, 44, 48], [43, 47, 50]], w: 'sawtooth', hat: 0 }    /* Abysse : do mineur, sombre */
];
const ARP = [0, 1, 2, 1, 0, 2, 1, 2];
let musT = 0, musI = 0;
function updMusic(dt) {
  if (!Snd.ac || Snd.muted || !CFG.music) return;
  musT -= dt; if (musT > 0) return;
  const boss = GS === 'run' && RUN && RUN.st === 'boss', M = MUSIC[GS === 'run' && RUN ? RUN.zone + 1 : 0], st = M.step * (boss ? 0.75 : 1);
  musT += st; if (musT < -0.5) musT = 0;
  const i = musI++, bar = (i >> 4) % 4, s = i % 16, ch = M.ch[bar];
  if (s === 0) { Snd.mus(NOTE(ch[0] + 12), st * 16, 'sine', 0.035, 0, 0.4); Snd.mus(NOTE(ch[2] + 12), st * 16, 'sine', 0.028, 0, 0.4); }
  if (s % 8 === 0 || ((M.hat || boss) && s % 4 === 0)) Snd.mus(NOTE(ch[0] - 12), st * 3.5, 'triangle', 0.1, 0, 0.01);
  if (s % 2 === 0) Snd.mus(NOTE(ch[ARP[(s >> 1) % 8]] + 12 + (bar === 3 && s >= 8 ? 12 : 0)), st * 1.9, M.w, M.w === 'triangle' ? 0.05 : 0.02);
  if ((s === 4 || s === 12) && hash2(i, bar, 5) < 0.45) Snd.mus(NOTE(ch[(i >> 2) % 3] + 24), st * 3, 'sine', 0.035);
  if (M.hat || boss) { if (s % 2 === 1) Snd.noise(0.03, 0.02, 7000, 0, 0, 3, Snd.musBus); if (boss && s % 4 === 0) Snd.noise(0.08, 0.09, 140, 60, 0, 1, Snd.musBus); }
}
function sfx(name, arg) {
  const now = performance.now();
  if (Snd.last[name] && now - Snd.last[name] < 45 && name !== 'drop') return;
  Snd.last[name] = now;
  if (SFX[name]) SFX[name](arg);
}

    if (i === 2 && maxN > 1) txt('' + P.dashN, x + 19, y0 + 13, C_.gold, { al: 2 });
    txt(s[3], x + 11, y0 + 25, C_.dim, { al: 1 });
  });
  /* notifications */
  let ny = H - 14; for (let i = notifs.length - 1; i >= 0; i--) { const n = notifs[i]; g.globalAlpha = n.t > 4 ? Math.max(0, 5 - n.t) : 1; txt(n.s, 6, ny, n.col); ny -= 10; } g.globalAlpha = 1;
  txt(KL.inv + ' Sac • ' + KL.char + ' Perso • ' + KL.tal + ' Talents • ' + KL.codex + ' Codex', W - 5, H - 11, C_.off, { al: 2, sh: false });
  /* infobulle de comparaison au survol d'un objet au sol */
  if (!UIS && !P.dead) { const wx = mouse.x + cam.x, wy = mouse.y + cam.y; for (const d of drops) if (d.land && Math.abs(d.x - wx) < 12 && Math.abs(d.y - 6 - wy) < 12) { itemTip(d.it, { cmp: true, hints: [dist(d, P) < 28 ? 'E : ramasser' : 'Approchez-vous pour ramasser'] }); break; } }
  /* sac presque plein + flèche vers les derniers ennemis hors écran */
  if (SAVE.inv.length >= INV_MAX - 8) txt('Sac ' + SAVE.inv.length + ' / ' + INV_MAX, W - 5, H - 22, SAVE.inv.length >= INV_MAX ? C_.red : C_.gold, { al: 2 });
  if (GS === 'run' && !P.dead && !UIS) {
    let al = 0, best = null, bd = 1e9, on = false;
    for (const e of enemies) { if (e.dead) continue; al++; const sx = e.x - cam.x, sy = e.y - cam.y; if (sx > 0 && sx < W && sy > 0 && sy < H) on = true; const d = dist(e, P); if (d < bd) { bd = d; best = e; } }
    if (best && !on && al <= 5 && Math.floor(TIME * 4) % 2 === 0) { const a = Math.atan2(best.y - P.y, best.x - P.x), px = Math.round(clamp(P.x - cam.x + Math.cos(a) * 220, 10, W - 10)), py = Math.round(clamp(P.y - cam.y + Math.sin(a) * 220, 40, H - 48)); frame(px - 3, py - 3, 7, 7, best.boss ? '#ff2e4d' : best.elite ? '#f2c94c' : '#ff6a6a', OUT); g.fillStyle = '#ffffff'; g.fillRect(px - 1, py - 1, 3, 3); }
  }
  /* invites contextuelles */
  if (!P.dead) {
    let pr = null;
    if (GS === 'hub' && P.station) pr = '[' + KL.use + '] ' + P.station.n;
    else if (GS === 'run' && RUN.st === 'won' && RUN.t > 1.5 && dist(P, RUN.portal) < 20 && !P.nearDrop) pr = '[' + KL.use + '] Retour au camp';
    if (GS === 'run' && P.nearObj) pr = '[' + KL.use + '] ' + P.nearObj.n;
    if (pr) { const w = txtW(pr) + 10; frame(Math.round(W / 2 - w / 2), H - 58, w, 13, '#0a0c16', C_.gold); txt(pr, W / 2, H - 55, C_.gold, { al: 1 }); }
  }
  if (P.hp < st.hpMax * 0.3 && !P.dead) { g.fillStyle = '#ff2e4d'; g.globalAlpha = 0.1 + 0.08 * Math.sin(TIME * 8); g.fillRect(0, 0, W, 5); g.fillRect(0, H - 5, W, 5); g.fillRect(0, 0, 5, H); g.fillRect(W - 5, 0, 5, H); g.globalAlpha = 1; }
  if (hurtFlash > 0) { g.fillStyle = '#ff2e4d'; g.globalAlpha = hurtFlash * 0.5; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
  /* bannières */
  drawHudExtras();
  if (bannerMsg) { const b = bannerMsg, a = b.t < 0.25 ? b.t * 4 : b.t > 2 ? Math.max(0, (2.5 - b.t) * 2) : 1; g.globalAlpha = a * 0.6; g.fillStyle = '#06050c'; g.fillRect(0, 54, W, b.sub ? 40 : 28); g.globalAlpha = a; txt(b.s, W / 2, 61, b.col, { al: 1, sc: 2, ol: OUT }); if (b.sub) txt(b.sub, W / 2, 82, C_.tx, { al: 1 }); g.globalAlpha = 1; }
  if (mythicMsg) {
    const m = mythicMsg, a = m.t < 0.3 ? m.t / 0.3 : m.t > 3.4 ? Math.max(0, (4 - m.t) / 0.6) : 1, cc = rarCol(5);
    g.globalAlpha = a * 0.7; g.fillStyle = '#12020a'; g.fillRect(0, 96, W, 58); g.globalAlpha = a; g.fillStyle = cc; g.fillRect(0, 96, W, 1); g.fillRect(0, 153, W, 1);
    for (let i = 0; i < 14; i++) { const xx = (i * 37 + TIME * 120) % W; g.fillRect(Math.round(xx), 98 + (i * 7) % 52, 6, 1); }
    txt('MYTHIQUE', W / 2, 104, cc, { al: 1, sc: 3, ol: OUT }); txt(m.name, W / 2, 136, '#ffffff', { al: 1, ol: OUT }); g.globalAlpha = 1;
  }
  if (P.dead && P.deadT > 1.2) {
    g.fillStyle = 'rgba(20,2,8,' + Math.min(0.75, (P.deadT - 1.2) * 1.2) + ')'; g.fillRect(0, 0, W, H);
    txt('VOUS ÊTES TOMBÉ', W / 2, 96, C_.red, { al: 1, sc: 3, ol: OUT }); txt('Votre butin et votre expérience sont conservés.', W / 2, 134, C_.tx, { al: 1 });
    if (P.deadT > 2) { if (btn(W / 2 - 146, 152, 140, 18, 'Recommencer la zone')) startRun(RUN.zone, RUN.tier); else if (btn(W / 2 + 6, 152, 140, 18, 'Retour au camp')) enterHub(); }
  }
}
const PANELS = { inv: drawInv, char: drawChar, codex: drawCodex, forge: drawForge, zones: drawZones, pause: drawPause };

/* =====================================================================
   SECTION 9 — BOUCLE PRINCIPALE (60 FPS, requestAnimationFrame + delta time)
   ===================================================================== */
function update(dt) {
  TIME += dt; pollPad(dt); updMusic(dt);
  if (kp.Mute) toggleMute();
  shakeV *= Math.pow(0.0008, dt); if (shakeV < 0.3) shakeV = 0;
  if (flashA > 0) flashA -= dt * 1.6; if (hurtFlash > 0) hurtFlash -= dt;
  if (GS === 'title') { updAmbient(dt); return; }
  SAVE.stats.time += dt; updTut(dt);
  for (const n of notifs) n.t += dt; notifs = notifs.filter(n => n.t < 5);
  if (bannerMsg) { bannerMsg.t += dt; if (bannerMsg.t > 2.5) bannerMsg = null; }
  if (mythicMsg) { mythicMsg.t += dt; if (mythicMsg.t > 4) mythicMsg = null; }
  if (kp[K.dash]) P.dashBuf = 0.15; else if (P.dashBuf > 0) P.dashBuf -= dt;
  if (!P.dead) {
    if (kp.Escape) { UIS = UIS ? null : 'pause'; sfx('click'); ui.confirmBulk = ui.confirmQuit = ui.confirmWipe = 0; }
    else if (kp[K.inv] || kp.Tab) { UIS = UIS === 'inv' ? null : 'inv'; sfx('click'); }
    else if (kp[K.char]) { UIS = UIS === 'char' ? null : 'char'; sfx('click'); }
    else if (kp[K.codex]) { UIS = UIS === 'codex' ? null : 'codex'; sfx('click'); }
    else if (kp[K.tal]) { UIS = UIS === 'talents' ? null : 'talents'; sfx('click'); }
  } else UIS = null;
  if (!UIS) {
    let wdt = dt;
    if (slowmo > 0) { slowmo -= dt; wdt *= 0.3; }
    if (hitStop > 0) { hitStop -= dt; wdt = 0; }
    if (wdt > 0) updWorld(wdt);
  }
  if (saveDirty) { saveT += dt; if (saveT > 2) saveNow(); }
}
function render() {
  renderWorld();
  if (GS === 'title') drawTitle();
  else {
    drawHUD();
    if (UIS) { g.fillStyle = 'rgba(6,5,14,0.55)'; g.fillRect(0, 0, W, H); PANELS[UIS](); }
  }
  drawTip();
  if (flashA > 0) { g.globalAlpha = Math.min(1, flashA); g.fillStyle = flashC; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
  const menu = GS === 'title' || UIS || P.dead, cu = menu ? UI.hand : UI.cursor;
  g.drawImage(cu.c, Math.round(mouse.x) - (menu ? 1 : 4), Math.round(mouse.y) - (menu ? 1 : 4));
  /* agrandissement par facteur entier, sans lissage */
  sctx.imageSmoothingEnabled = false;
  sctx.drawImage(buf, 0, 0, W * SCALE, H * SCALE);
}
let lastT = 0;
function loop(t) {
  const dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000)); lastT = t;
  update(dt); render(); endInput();
  requestAnimationFrame(loop);
}

/* =====================================================================
   SECTION 8 bis — INTERFACE ADDITIONNELLE : talents, coffre du camp,
   options (touches, audio, export / import), tutoriel, éléments de HUD
   ===================================================================== */
const recalc = () => { const r = P.hp / P.st.hpMax; calcStats(); P.hp = Math.max(1, Math.round(P.st.hpMax * r)); markSave(); };
const SKILLD = { guerrier: 'Tournoyez 1,2 s en frappant tout autour de vous (80 % par coup).', mage: 'Explosion de zone sous le curseur (340 %).', archer: 'Sept flèches perçantes en éventail (95 % chacune).' };
const FILTN = ['Tous', 'Armes', 'Casques', 'Armures', 'Gants', 'Bottes', 'Amulettes', 'Anneaux', 'Sets', 'Uniques'];
function filtOk(it) { const f = ui.filt || 0; return f === 0 || (f <= 7 ? it.slot === SLOTS[f - 1] : f === 8 ? !!it.set : !!it.uid); }

/* ---------- talents (T) ---------- */
function drawTalents() {
  const free = talFree();
  if (panel(30, 12, 420, 246, 'Talents — ' + free + ' point' + (free > 1 ? 's' : '') + ' disponible' + (free > 1 ? 's' : ''))) return;
  for (let b = 0; b < 3; b++) {
    const x = 42 + b * 134; txt(BRANCH[b][0], x + 63, 33, BRANCH[b][1], { al: 1 });
    TALENTS.filter(t => t.br === b).forEach((t, i) => {
      const y = 46 + i * 31, r = SAVE.tal[t.id] || 0, hov = inRect(x, y, 126, 27);
      frame(x, y, 126, 27, hov ? '#1e2540' : C_.bg3, r >= t.max ? C_.gold : r ? BRANCH[b][1] : C_.bd);
      txt(t.n, x + 6, y + 4, r ? '#ffffff' : C_.tx); txt(r + ' / ' + t.max, x + 120, y + 4, r >= t.max ? C_.gold : C_.dim, { al: 2 });
      for (let k = 0; k < t.max; k++) { g.fillStyle = k < r ? BRANCH[b][1] : '#2a3048'; g.fillRect(x + 6 + k * 12, y + 17, 10, 4); }
      if (!hov) return;
      tip = { L: [{ s: t.n, c: BRANCH[b][1] }, { s: t.d, c: C_.tx }, { s: 'Clic : +1 rang • Clic droit : -1 rang', c: C_.off }], x: mouse.x, y: mouse.y };
      if (mouse.lc) { mouse.lc = false; if (free > 0 && r < t.max) { SAVE.tal[t.id] = r + 1; sfx('upgrade'); recalc(); } else sfx('deny'); }
      else if (mouse.rc) { mouse.rc = false; if (r > 0) { SAVE.tal[t.id] = r - 1; sfx('click'); recalc(); } }
    });
  }
  const c = CLS[SAVE.cls], y = 174; txt('Compétence du clic droit', 42, y, C_.gold);
  [[c.skill, SKILLD[SAVE.cls], c.skillCd], [c.skillB.n, c.skillB.d, c.skillB.cd]].forEach((s, i) => {
    const x = 42 + i * 200;
    if (btn(x, y + 12, 192, 16, s[0], { sel: !!SAVE.skillB === !!i })) { SAVE.skillB = !!i; P.skillT = Math.max(P.skillT, 1); markSave(); }
    if (inRect(x, y + 12, 192, 16)) tip = { L: [{ s: s[0], c: c.col }].concat(wrapTxt(s[1], 190).map(t => ({ s: t, c: C_.tx })), [{ s: 'Recharge : ' + String(s[2]).replace('.', ',') + ' s', c: C_.dim }]), x: mouse.x, y: mouse.y };
  });
  if (btn(42, 214, 150, 16, 'Réinitialiser les talents', { en: talUsed() > 0 })) { SAVE.tal = {}; recalc(); sfx('recycle'); }
  txt('1 point par niveau. Réattribution libre et gratuite.', 200, 219, C_.off);
  txt('Les bonus s\'ajoutent à ceux de l\'équipement.', 42, 238, C_.off);
}

/* ---------- coffre du camp ---------- */
function drawStash() {
  if (panel(8, 8, 464, 254, 'Coffre du camp  (' + SAVE.stash.length + ' / ' + STASH_MAX + ')')) return;
  txt('Inventaire  (' + SAVE.inv.length + ' / ' + INV_MAX + ')', 14, 29, C_.dim); txt('Coffre', 222, 29, C_.dim);
  for (let i = 0; i < INV_MAX; i++) {
    const x = 14 + (i % 10) * 20, y = 40 + Math.floor(i / 10) * 20, it = SAVE.inv[i];
    if (itemCell(x, y, it) && it) { itemTip(it, { cmp: true, hints: ['Clic : déposer dans le coffre'] }); if (mouse.lc) { mouse.lc = false; if (SAVE.stash.length < STASH_MAX) { SAVE.inv.splice(i, 1); SAVE.stash.push(it); sfx('equip'); markSave(); } else sfx('deny'); } }
  }
  for (let i = 0; i < STASH_MAX; i++) {
    const x = 222 + (i % 12) * 20, y = 40 + Math.floor(i / 12) * 20, it = SAVE.stash[i];
    if (itemCell(x, y, it) && it) { itemTip(it, { cmp: true, hints: ['Clic : reprendre'] }); if (mouse.lc) { mouse.lc = false; if (SAVE.inv.length < INV_MAX) { SAVE.stash.splice(i, 1); SAVE.inv.push(it); sfx('equip'); markSave(); } else { sfx('deny'); notify('Inventaire plein !', C_.red); } } }
  }
  if (btn(14, 168, 96, 14, 'Tout déposer')) { for (const it of SAVE.inv.slice()) if (!it.fav && SAVE.stash.length < STASH_MAX) { SAVE.inv.splice(SAVE.inv.indexOf(it), 1); SAVE.stash.push(it); } sfx('equip'); markSave(); }
  if (btn(114, 168, 96, 14, 'Trier le coffre')) { const so = it => SLOTS.indexOf(it.slot); SAVE.stash.sort((a, b) => b.rar - a.rar || so(a) - so(b) || b.il - a.il); sfx('click'); markSave(); }
  ['Clic sur un objet : le déplacer.', '« Tout déposer » laisse les favoris (★)', 'dans votre inventaire.', 'Le coffre garde vos sets et vos', 'builds de rechange en sécurité.'].forEach((s, i) => txt(s, 14, 190 + i * 10, i < 1 ? C_.tx : C_.dim));
}

/* ---------- options : touches, audio, sauvegarde ---------- */
function exportSave() {
  saveNow();
  try {
    const b = new Blob([JSON.stringify(SAVE)], { type: 'application/json' }), u = URL.createObjectURL(b), a = document.createElement('a');
    a.href = u; a.download = 'reliques-ether-' + SAVE.cls + '-niv' + SAVE.lvl + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 3000);
    notify('Sauvegarde exportée (fichier .json)', C_.green);
  } catch (err) { notify('Export impossible dans ce navigateur', C_.red); }
}
function importSave() {
  try {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = () => {
      const f = inp.files && inp.files[0]; if (!f) return; const rd = new FileReader();
      rd.onload = () => { const d = parseSave(String(rd.result)); if (!d) { ui.impErr = TIME; sfx('deny'); if (SAVE) notify('Fichier de sauvegarde invalide', C_.red); return; } SAVE = d; saveNow(); beginGame(); notify('Sauvegarde importée', C_.green); };
      rd.readAsText(f);
    };
    inp.click();
  } catch (err) { ui.impErr = TIME; }
}
function toTitle() { saveNow(); SAVE = null; RUN = null; UIS = null; GS = 'title'; ui.classSel = false; ui.rebind = null; MAP = genHub(); clearEntities(); cam.x = cam.y = 0; refreshSlots(); }
function drawOptions() {
  if (panel(50, 10, 380, 250, 'Options')) { ui.rebind = null; return; }
  txt('Touches (cliquez puis appuyez sur la nouvelle touche)', 62, 30, C_.gold);
  Object.keys(KEYDEF).forEach((k, i) => {
    const x = 62 + (i % 2) * 184, y = 42 + Math.floor(i / 2) * 17; txt(KEYN[k], x, y + 3, C_.tx);
    if (btn(x + 112, y, 60, 14, ui.rebind === k ? '...' : KL[k], { sel: ui.rebind === k })) ui.rebind = k;
  });
  if (btn(62, 146, 172, 14, 'Rétablir les touches par défaut')) { Object.assign(K, KEYDEF); Object.assign(KL, LBLDEF); saveCfg(); }
  txt('Les flèches déplacent aussi le héros.', 246, 149, C_.off);
  txt('Manette : stick gauche bouger, stick droit viser, RT attaque,', 62, 164, C_.dim); txt('LT compétence, A esquive, Y ultime, X interagir, Start pause.', 62, 174, C_.dim);
  txt('Audio', 62, 190, C_.gold);
  if (btn(62, 201, 110, 14, 'Son : ' + (Snd.muted ? 'coupé' : 'activé'))) toggleMute();
  if (btn(178, 201, 110, 14, 'Musique : ' + (CFG.music ? 'activée' : 'coupée'))) { CFG.music = !CFG.music; Snd.apply(); saveCfg(); }
  txt('Volume', 298, 204, C_.tx);
  if (btn(334, 201, 12, 14, '◄')) { CFG.vol = Math.max(1, CFG.vol - 1); Snd.apply(); saveCfg(); sfx('click'); }
  if (btn(372, 201, 12, 14, '►')) { CFG.vol = Math.min(4, CFG.vol + 1); Snd.apply(); saveCfg(); sfx('click'); }
  txt('' + CFG.vol, 359, 204, C_.gold, { al: 1 });
  txt('Sauvegarde', 62, 222, C_.gold);
  if (btn(62, 233, 110, 14, 'Exporter (.json)')) exportSave();
  if (btn(178, 233, 110, 14, 'Importer (.json)')) importSave();
  if (btn(294, 233, 124, 14, 'Revoir le tutoriel')) { SAVE.tut = 0; P.tutT = 0; markSave(); UIS = null; }
}
PANELS.talents = drawTalents; PANELS.stash = drawStash; PANELS.options = drawOptions;

/* ---------- compléments du HUD : talents, autel, mini-carte, faiblesse, tutoriel ---------- */
function drawHudExtras() {
  const free = talFree();
  if (free > 0) txt('[' + KL.tal + '] ' + free + ' point' + (free > 1 ? 's' : '') + ' de talent', 5, 26, C_.gold);
  if (P.buff) { const s = SHRINES[P.buff.i]; txt(s.n + ' ' + Math.ceil(P.buff.t) + ' s', 5, free > 0 ? 36 : 26, s.c); }
  if (GS === 'run') {
    const z = ZONES[RUN.zone], mx0 = W - 52, my0 = 20;
    if (MAP.mini && RUN.chests) {
      for (const c of RUN.chests) if (!c.open) { g.fillStyle = '#f2c94c'; g.fillRect(mx0 + Math.floor(c.x / TS) - 1, my0 + Math.floor(c.y / TS) - 1, 2, 2); }
      for (const s of RUN.shrines) if (!s.used) { g.fillStyle = SHRINES[s.i].c; g.fillRect(mx0 + Math.floor(s.x / TS), my0 + Math.floor(s.y / TS), 2, 2); }
    }
    txt('Faible : ' + ELEMS[z.weak].n, W - 5, 58, ELEMS[z.weak].c, { al: 2 }); txt('Résiste : ' + ELEMS[z.res].n, W - 5, 68, C_.off, { al: 2 });
  }
  if (SAVE.tut < TUT.length && !UIS && !P.dead) {
    const s = TUT[SAVE.tut](), w = Math.max(txtW(s), 90) + 16, x = Math.round(W / 2 - w / 2), y = H - 86, hov = inRect(x + w - 13, y + 1, 12, 10);
    frame(x, y, w, 24, '#0a0c16', C_.gold); txt('Astuce ' + (SAVE.tut + 1) + ' / ' + TUT.length, x + 8, y + 3, C_.gold); txt(s, x + 8, y + 13, C_.tx);
    txt('×', x + w - 9, y + 3, hov ? '#ffffff' : C_.dim, { sh: false }); if (hov && mouse.lc) { mouse.lc = false; SAVE.tut = 99; markSave(); }
  }
}

/* ---------- écran-titre : trois emplacements de sauvegarde ---------- */
let slotSaves = [null, null, null];
function refreshSlots() { slotSaves = [0, 1, 2].map(i => loadSave(i)); }

/* ---------- démarrage ---------- */
refreshSlots();
MAP = genHub();
requestAnimationFrame(t => { lastT = t; requestAnimationFrame(loop); });
